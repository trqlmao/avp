version: 2

# Dependency update PRs. The Bun projects (`examples/conformance` and `harness`) are managed with Bun; Dependabot
# has no Bun-lockfile updater, and bumping package.json without updating bun.lock
# would break the `bun install --frozen-lockfile` CI, so those projects are left
# to Bun + the committed frozen lockfile and are intentionally not listed here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /examples/rust/avp
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /examples/rust/server
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /examples/rust/client
    schedule:
      interval: weekly
