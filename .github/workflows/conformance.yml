name: conformance

# Executable conformance:
#   - vectors: reproduce vectors/ and check schema/example/index/openapi consistency (examples/conformance)
#   - openapi: lint openapi.yaml with Spectral
#   - black-box: drive the full wire contract against the Rust and Java reference servers (harness/)

on:
  push:
    paths:
      - "examples/**"
      - "harness/**"
      - "schema/**"
      - "vectors/**"
      - "openapi.yaml"
      - ".spectral.yaml"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "examples/**"
      - "harness/**"
      - "schema/**"
      - "vectors/**"
      - "openapi.yaml"
      - ".spectral.yaml"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

jobs:
  vectors:
    name: vectors + schema consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile --cwd examples/conformance
      - name: Typecheck
        run: bun run --cwd examples/conformance typecheck
      - name: Reproduce vectors and check artifact consistency
        run: bun run --cwd examples/conformance test
      - name: Re-derive vectors from seeds (provenance and drift gate)
        run: bun vectors/generate.ts --check

  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Spectral lint
        run: bunx @stoplight/spectral-cli@6 lint openapi.yaml --ruleset .spectral.yaml --fail-severity error

  black-box:
    name: black-box (${{ matrix.server }} server)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [rust, java]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The harness runs under Bun (no install: only node:crypto + global fetch).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        if: matrix.server == 'rust'
        with:
          toolchain: stable

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: matrix.server == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - name: Run the harness against the ${{ matrix.server }} reference server
        env:
          SERVER: ${{ matrix.server }}
        run: |
          set -e
          PORT=19101

          case "$SERVER" in
            rust)
              PORT=$PORT cargo run --manifest-path examples/rust/server/Cargo.toml --quiet &
              SRV_PID=$!
              ;;
            java)
              (cd examples/java/server && javac Server.java && PORT=$PORT java Server) &
              SRV_PID=$!
              ;;
          esac

          # Poll until the server accepts connections (up to 20 s).
          for i in $(seq 1 100); do
            curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
              -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
            -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 \
            || { echo "server did not start within 20s"; exit 1; }

          bun harness/conformance.ts --server "http://localhost:$PORT"
          HARNESS_EXIT=$?

          kill $SRV_PID 2>/dev/null || true
          wait $SRV_PID 2>/dev/null || true

          exit $HARNESS_EXIT
