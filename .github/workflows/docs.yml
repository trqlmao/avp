name: docs

# Keep llms-full.txt in sync with its source docs. It is a generated bundle
# (scripts/build-llms-full.mjs); this fails if a source doc changed without
# regenerating it.

on:
  push:
    paths:
      - "IMPLEMENTING.md"
      - "SPEC.md"
      - "THREATMODEL.md"
      - "llms-full.txt"
      - "scripts/build-llms-full.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "IMPLEMENTING.md"
      - "SPEC.md"
      - "THREATMODEL.md"
      - "llms-full.txt"
      - "scripts/build-llms-full.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  llms-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check llms-full.txt is in sync with its sources
        run: node scripts/build-llms-full.mjs --check
