name: examples-go

on:
  push:
    paths:
      - "examples/go/**"
      - "vectors/**"
      - ".github/workflows/examples-go.yml"
  pull_request:
    paths:
      - "examples/go/**"
      - "vectors/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.22"
      - name: Vet, test, and build the client and server
        run: |
          go vet ./...
          go test ./...
          go build ./...
