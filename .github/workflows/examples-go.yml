name: examples-go

on:
  push:
    paths:
      - "examples/go/**"
      - "vectors/**"
      - ".github/workflows/examples-go.yml"
  pull_request:
    paths:
      - "examples/go/**"
      - "vectors/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.22"
      - name: Vet, test, and build the client and server
        run: |
          go vet ./...
          go test ./...
          go build ./...
