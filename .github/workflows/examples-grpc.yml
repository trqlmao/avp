name: examples-grpc

# Run the gRPC reference example end to end: start the in-memory gRPC server and drive the full
# lifecycle (auth over gRPC, then all six Vault RPCs) with the gRPC client. The client's waitForReady
# handles the server-start race, so no port polling is needed.

on:
  push:
    paths:
      - "examples/grpc/**"
      - "examples/typescript/client/src/crypto.ts"
      - "proto/avp.proto"
      - ".github/workflows/examples-grpc.yml"
  pull_request:
    paths:
      - "examples/grpc/**"
      - "examples/typescript/client/src/crypto.ts"
      - "proto/avp.proto"
      - ".github/workflows/examples-grpc.yml"

permissions:
  contents: read

jobs:
  grpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile --cwd examples/grpc
      - name: Typecheck
        run: bun run --cwd examples/grpc typecheck
      - name: Start the server and run the client
        run: |
          set -e
          (cd examples/grpc && PORT=50051 bun run server) &
          SRV_PID=$!
          (cd examples/grpc && AVP_GRPC_TARGET=localhost:50051 bun run client)
          CLIENT_EXIT=$?
          kill $SRV_PID 2>/dev/null || true
          wait $SRV_PID 2>/dev/null || true
          exit $CLIENT_EXIT
