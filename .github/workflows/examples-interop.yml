name: examples-interop

# Cross-language wire interop: for each language, verify
#   (1) lang-client -> Go-server  and  (2) Go-client -> lang-server
# Both members are generated by the same client process so the crypto
# round-trip is intact; only the wire (routes, JSON shape, auth, URL-encoded
# member-id path) is under test. The Go example is the hub reference.

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/examples-interop.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples-interop.yml"

permissions:
  contents: read

jobs:
  interop:
    name: interop (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, python, java, rust]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # --- Go (always needed: hub reference client + server) -----------------
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.22"

      # --- Language-specific toolchain ---------------------------------------
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.lang == 'typescript'
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        if: matrix.lang == 'rust'
        with:
          toolchain: stable

      # --- Build -------------------------------------------------------------
      - name: Build (Go)
        working-directory: examples/go
        run: go build ./...

      - name: Build (TypeScript)
        if: matrix.lang == 'typescript'
        run: |
          bun install --frozen-lockfile --cwd examples/typescript/server
          bun install --frozen-lockfile --cwd examples/typescript/client

      - name: Build (Python)
        if: matrix.lang == 'python'
        run: |
          pip install -r examples/python/server/requirements.txt
          pip install -r examples/python/client/requirements.txt

      - name: Build (Java)
        if: matrix.lang == 'java'
        run: |
          javac examples/java/server/Server.java
          javac examples/java/client/Crypto.java examples/java/client/Client.java

      - name: Build (Rust)
        if: matrix.lang == 'rust'
        run: |
          cargo build --manifest-path examples/rust/server/Cargo.toml
          cargo build --manifest-path examples/rust/client/Cargo.toml

      # --- Direction 1: lang-client -> Go-server ----------------------------
      - name: "Direction 1: ${{ matrix.lang }} client -> Go server"
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -e
          PORT=19001

          # Start the Go reference server
          (cd examples/go/server && PORT=$PORT go run .) &
          GO_SRV_PID=$!

          # Poll until the server accepts connections (up to 20 s)
          for i in $(seq 1 100); do
            curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
              -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
            -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 \
            || { echo "server did not start within 20s"; exit 1; }

          # Run the language client against the Go server
          case "$LANG_UNDER_TEST" in
            typescript)
              AVP_SERVER_URL=http://localhost:$PORT \
                bun run --cwd examples/typescript/client start
              ;;
            python)
              AVP_SERVER_URL=http://localhost:$PORT \
                python examples/python/client/client.py
              ;;
            java)
              AVP_SERVER_URL=http://localhost:$PORT \
                java -cp examples/java/client Client
              ;;
            rust)
              AVP_SERVER_URL=http://localhost:$PORT \
                cargo run --manifest-path examples/rust/client/Cargo.toml --quiet
              ;;
          esac
          CLIENT_EXIT=$?

          kill $GO_SRV_PID 2>/dev/null || true
          wait $GO_SRV_PID 2>/dev/null || true

          exit $CLIENT_EXIT

      # --- Direction 2: Go-client -> lang-server ----------------------------
      - name: "Direction 2: Go client -> ${{ matrix.lang }} server"
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -e
          PORT=19002

          # Start the language server
          case "$LANG_UNDER_TEST" in
            typescript)
              (cd examples/typescript/server && PORT=$PORT bun run start) &
              LANG_SRV_PID=$!
              ;;
            python)
              PORT=$PORT python examples/python/server/server.py &
              LANG_SRV_PID=$!
              ;;
            java)
              (cd examples/java/server && PORT=$PORT java Server) &
              LANG_SRV_PID=$!
              ;;
            rust)
              PORT=$PORT cargo run --manifest-path examples/rust/server/Cargo.toml --quiet &
              LANG_SRV_PID=$!
              ;;
          esac

          # Poll until the server accepts connections (up to 20 s)
          for i in $(seq 1 100); do
            curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
              -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS -X POST "http://localhost:$PORT/api/auth/keypair/challenge" \
            -H 'content-type: application/json' -d '{}' >/dev/null 2>&1 \
            || { echo "server did not start within 20s"; exit 1; }

          # Run the Go reference client against the language server
          (cd examples/go/client && AVP_SERVER_URL=http://localhost:$PORT go run .)
          CLIENT_EXIT=$?

          kill $LANG_SRV_PID 2>/dev/null || true
          wait $LANG_SRV_PID 2>/dev/null || true

          exit $CLIENT_EXIT
