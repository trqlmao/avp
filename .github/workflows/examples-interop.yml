name: examples-interop

# Cross-language interop between the Rust and Java reference examples. Each client runs
# its worked flow:
#   - against the other language's host alone (rust-client-java-host, java-client-rust-host);
#   - with bob's home host (AVP_SERVER_URL_B) on the other language's host, peered with the
#     owner's host in the client's own language, so host-to-host replication crosses
#     languages too (rust-client-two-hosts, java-client-two-hosts).
# harness/run-hosts.sh builds and starts the hosts on 127.0.0.1, exports AVP_SERVER_URL and
# AVP_SERVER_URL_B, runs the client, and stops the hosts.

on:
  push:
    paths:
      - "examples/**"
      - "vectors/**"
      - "harness/**"
      - ".github/workflows/examples-interop.yml"
  pull_request:
    paths:
      - "examples/**"
      - "vectors/**"
      - "harness/**"
      - ".github/workflows/examples-interop.yml"

permissions:
  contents: read

jobs:
  interop:
    name: interop (${{ matrix.pair }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pair: [rust-client-java-host, java-client-rust-host, rust-client-two-hosts, java-client-two-hosts]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # run-hosts.sh derives the host keys with the harness crypto under Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable

      - name: Build the clients
        run: |
          cargo build --manifest-path examples/rust/client/Cargo.toml
          (cd examples/java/client && javac -d build ../avp/*.java Vault.java Client.java)

      - name: "Run ${{ matrix.pair }}"
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          RUST_CLIENT="cargo run --quiet --manifest-path examples/rust/client/Cargo.toml"
          JAVA_CLIENT="java -Davp.wordlist=vectors/bip39-english.txt -cp examples/java/client/build Client"
          case "$PAIR" in
            rust-client-java-host) bash harness/run-hosts.sh java -- $RUST_CLIENT ;;
            java-client-rust-host) bash harness/run-hosts.sh rust -- $JAVA_CLIENT ;;
            rust-client-two-hosts) bash harness/run-hosts.sh rust java -- $RUST_CLIENT ;;
            java-client-two-hosts) bash harness/run-hosts.sh java rust -- $JAVA_CLIENT ;;
            *) echo "unknown pair $PAIR"; exit 1 ;;
          esac
