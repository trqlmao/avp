name: examples-java

# The Java reference sources (JDK 21, no build tool): the shared avp library against
# vectors/ (AvpVectors), the host (SmokeTest), and the client (ClientTest, against
# real in-process hosts).

on:
  push:
    paths:
      - "examples/java/**"
      - "examples/rust/avp/**"
      - "vectors/**"
      - ".github/workflows/examples-java.yml"
  pull_request:
    paths:
      - "examples/java/**"
      - "examples/rust/avp/**"
      - "vectors/**"
      - ".github/workflows/examples-java.yml"

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Shared library vectors (AvpVectors)
        working-directory: examples/java/avp
        run: |
          javac -d build *.java
          java -cp build AvpVectors
      - name: Host smoke test (SmokeTest)
        working-directory: examples/java/server
        run: |
          javac -d build ../avp/*.java *.java
          java -cp build SmokeTest
      - name: Client tests (ClientTest)
        working-directory: examples/java/client
        run: |
          javac -d build ../avp/*.java ../server/Server.java ../server/Replication.java *.java
          java -cp build ClientTest
