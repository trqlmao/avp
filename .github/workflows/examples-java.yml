name: examples-java

on:
  push:
    paths:
      - "examples/java/**"
      - ".github/workflows/examples-java.yml"
  pull_request:
    paths:
      - "examples/java/**"

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/java/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac Server.java SmokeTest.java
      - run: java SmokeTest
