name: examples-python

on:
  push:
    paths:
      - "examples/python/**"
      - ".github/workflows/examples-python.yml"
  pull_request:
    paths:
      - "examples/python/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Compile and test the server
        working-directory: examples/python/server
        run: |
          pip install -r requirements.txt
          python -m py_compile server.py test_server.py
          python -m unittest test_server.py
      - name: Compile the client
        working-directory: examples/python/client
        run: |
          pip install -r requirements.txt
          python -m py_compile client.py crypto.py
          python -m unittest test_crypto.py
