name: examples-python

on:
  push:
    paths:
      - "examples/python/**"
      - ".github/workflows/examples-python.yml"
  pull_request:
    paths:
      - "examples/python/**"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py test_server.py
      - run: python -m unittest test_server.py
