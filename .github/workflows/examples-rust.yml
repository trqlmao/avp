name: examples-rust

on:
  push:
    paths:
      - "examples/rust/**"
      - ".github/workflows/examples-rust.yml"
  pull_request:
    paths:
      - "examples/rust/**"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the server
        working-directory: examples/rust/server
        run: |
          cargo build --verbose
          cargo test --verbose
      - name: Build the client
        working-directory: examples/rust/client
        run: cargo build --verbose
