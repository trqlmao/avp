name: examples-rust

# The Rust reference crates: the shared avp library, the host, and the client. Each is
# formatted with the house profile (examples/rust/rustfmt.toml), clippy-clean with
# -D warnings, and tested (the tests read vectors/).

on:
  push:
    paths:
      - "examples/rust/**"
      - "examples/java/avp/**"
      - "vectors/**"
      - ".github/workflows/examples-rust.yml"
  pull_request:
    paths:
      - "examples/rust/**"
      - "examples/java/avp/**"
      - "vectors/**"
      - ".github/workflows/examples-rust.yml"

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [avp, server, client]
    defaults:
      run:
        working-directory: examples/rust/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check -- --config-path ../rustfmt.toml
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
