name: examples-rust

on:
  push:
    paths:
      - "examples/rust/**"
      - ".github/workflows/examples-rust.yml"
  pull_request:
    paths:
      - "examples/rust/**"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable
      - name: Build and test the server
        working-directory: examples/rust/server
        run: |
          cargo build --verbose
          cargo test --verbose
      - name: Build and test the client
        working-directory: examples/rust/client
        run: |
          cargo build --verbose
          cargo test --verbose
