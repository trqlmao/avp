name: examples-rust

on:
  push:
    paths:
      - "examples/rust/**"
      - ".github/workflows/examples-rust.yml"
  pull_request:
    paths:
      - "examples/rust/**"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable
      - name: Build and test the server
        working-directory: examples/rust/server
        run: |
          cargo build --verbose
          cargo test --verbose
      - name: Build the client
        working-directory: examples/rust/client
        run: cargo build --verbose
