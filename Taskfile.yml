# One-command local runner for the AVP reference examples and conformance suite.
#
# Uses go-task (https://taskfile.dev): `task --list`. Each target mirrors the matching
# .github/workflows/examples-*.yml job, so "green locally" means "green in CI". Each language
# is independent; run only the toolchains you have installed.
#
# Requirements per target: conformance -> Bun; rust -> Cargo (with rustfmt and clippy); java -> JDK 21+.
# `task test` runs the conformance, vector, rust and java targets and needs them all. harness, multihost and
# interop start the reference hosts with harness/run-hosts.sh (the launcher CI uses: build, start on
# AVP_BIND=127.0.0.1, poll /.well-known/avp, stop) and need Bun, Cargo, a JDK, bash and curl.
version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list
    silent: true

  test:
    desc: Run the conformance suite and every language's example tests.
    cmds:
      - task: conformance
      - task: vectors-check
      - task: rust
      - task: java

  conformance:
    desc: Reproduce every vector in vectors/ and check schema/example/index/openapi consistency.
    dir: examples/conformance
    cmds:
      - bun install --frozen-lockfile
      - bun run typecheck
      - bun run test

  vectors-check:
    desc: Re-derive every vector from its documented seeds (provenance and drift gate).
    cmds:
      - bun vectors/generate.ts --check

  openapi-lint:
    desc: Lint openapi.yaml with Spectral.
    cmds:
      - bunx @stoplight/spectral-cli@6 lint openapi.yaml --ruleset .spectral.yaml --fail-severity error

  harness:
    desc: Run the single-host conformance harness against the Rust and then the Java reference host (about 2 min each).
    cmds:
      - bash harness/run-hosts.sh rust -- bun harness/conformance.ts --server http://127.0.0.1:19201
      - bash harness/run-hosts.sh java -- bun harness/conformance.ts --server http://127.0.0.1:19201

  multihost:
    desc: Run the multi-host harness on three hosts for each pairing (rust-rust, java-java, rust-java; about 70 s each).
    cmds:
      - for: ["rust rust rust", "java java java", "rust java java"]
        cmd: >-
          bash harness/run-hosts.sh {{.ITEM}} -- bun harness/multihost.ts
          --a http://127.0.0.1:19201 --b http://127.0.0.1:19202 --c http://127.0.0.1:19203

  rust:
    desc: Format-check, lint and test the Rust avp library, host and client.
    cmds:
      - for: [avp, server, client]
        cmd: >-
          cd examples/rust/{{.ITEM}} &&
          cargo fmt --check -- --config-path ../rustfmt.toml &&
          cargo clippy --all-targets -- -D warnings &&
          cargo test

  java:
    desc: Compile and run the Java library vectors (AvpVectors), host smoke test (SmokeTest) and client tests (ClientTest).
    cmds:
      - cd examples/java/avp && javac -d build *.java && java -cp build AvpVectors
      - cd examples/java/server && javac -d build ../avp/*.java *.java && java -cp build SmokeTest
      - cd examples/java/client && javac -d build ../avp/*.java ../server/Server.java ../server/Replication.java *.java && java -cp build ClientTest

  interop:
    desc: Run each reference client against the other language's host, alone and as bob's home host (AVP_SERVER_URL_B).
    cmds:
      - cargo build --manifest-path examples/rust/client/Cargo.toml
      - cd examples/java/client && javac -d build ../avp/*.java Vault.java Client.java
      - bash harness/run-hosts.sh java -- cargo run --quiet --manifest-path examples/rust/client/Cargo.toml
      - bash harness/run-hosts.sh rust -- java -cp examples/java/client/build Client
      - bash harness/run-hosts.sh rust java -- cargo run --quiet --manifest-path examples/rust/client/Cargo.toml
      - bash harness/run-hosts.sh java rust -- java -cp examples/java/client/build Client
