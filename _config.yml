title: "AVP: Alt Vault Protocol"
description: An open, vendor-neutral, zero-knowledge, federated protocol for sharing Minecraft alt accounts across clients.

# GitHub Pages renders the Markdown in this repo as a site. The README is the home page;
# SPEC.md and the guides become pages. jekyll-relative-links (on by default on Pages)
# rewrites the .md links so they resolve on the site. The look is a hand-written layout
# (_layouts/default.html + assets/css/style.css), not a gem theme.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Agent/meta files that should not become public site pages. (node_modules,
# vendor, and Gemfile are excluded by GitHub Pages automatically.)
exclude:
  - CLAUDE.md
  - PULL_REQUEST_TEMPLATE.md
  - "examples/**/node_modules"
  - "examples/**/target"
