[package]
name = "avp"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Shared AVP 0.5 library for the Rust reference host and client: canonical encoding, crypto, owner identity, manifests, commits, payload merge, tokens, and the host rules engine. Illustrative, not production."
license = "MIT"
publish = false

[dependencies]
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
hkdf = "=0.13.0"
hmac = "=0.13.0"
pbkdf2 = "=0.13.0"
rand = "=0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
thiserror = "2"
unicode-normalization = "=0.1.26"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
