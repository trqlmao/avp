[package]
name = "avp-reference-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "AVP 0.5 reference client (HTTP/JSON profile) over the shared avp crate: owner identity, verified manifest chain, signed commits, per-field merge, invites, removal, leave, and device linking. Illustrative, not production."
license = "MIT"
publish = false

[lib]
name = "avp_reference_client"
path = "src/lib.rs"

[[bin]]
name = "avp-reference-client"
path = "src/main.rs"

[dependencies]
avp = { path = "../avp" }
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
ureq = { version = "=3.5.2", default-features = false }
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }

[dev-dependencies]
avp-reference-server = { path = "../server" }
tiny_http = "=0.12.0"

[profile.release]
opt-level = 2
