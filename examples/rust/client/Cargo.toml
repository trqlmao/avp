[package]
name = "avp-reference-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
description = "Micro reference client for the Alt Vault Protocol (HTTP/JSON profile). Illustrative, not production."
license = "MIT"
publish = false

[[bin]]
name = "avp-reference-client"
path = "src/main.rs"

[dependencies]
ureq = "=2.12.1"
serde_json = "=1.0.150"
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
rand = "=0.8.6"
aes-gcm = "=0.10.3"
hkdf = "=0.13.0"
sha2 = "=0.10.8"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

[profile.release]
opt-level = 2
