[package]
name = "avp-reference-server"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
description = "In-memory reference server for the Alt Vault Protocol (HTTP/JSON profile). Illustrative, not production."
license = "MIT"
publish = false

[[bin]]
name = "avp-reference-server"
path = "src/main.rs"

[dependencies]
tiny_http = "=0.12.0"
serde_json = "=1.0.150"
ed25519-dalek = "=3.0.0"
base64 = "=0.22.1"
rand = "=0.8.6"

[profile.release]
opt-level = 2
