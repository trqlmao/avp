title: "AVP: Alt Vault Protocol"
description: An open, vendor-neutral, zero-knowledge, federated protocol for sharing Minecraft alt accounts across clients.
url: https://avp.trq.lol
baseurl: ""

# The site source is this folder; the pages workflow copies the repo Markdown in
# before building. The README is the home page; jekyll-relative-links rewrites the
# .md links. The look is a hand-written layout, not a gem theme.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Agent/meta files that should not become public site pages. (node_modules,
# vendor, and Gemfile are excluded by GitHub Pages automatically.)
exclude:
  - CLAUDE.md
  - PULL_REQUEST_TEMPLATE.md
  - "examples/**/node_modules"
  - "examples/**/target"

kramdown:
  syntax_highlighter_opts:
    guess_lang: true
